<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Trellis 任务画布</title>
<style>
:root{color-scheme:light;--bg:#f4f6f4;--paper:#fff;--ink:#202b27;--muted:#77817c;--line:#e4e9e5;--green:#527b68;--shadow:0 8px 28px #26372e0a}
*{box-sizing:border-box}html,body,#root{height:100%;margin:0}body{font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}button{font:inherit;color:inherit}.app-shell{height:100%;min-height:520px;display:flex;flex-direction:column}.app-header{height:76px;flex:none;display:flex;align-items:center;gap:13px;padding:0 25px;background:var(--paper);border-bottom:1px solid var(--line)}.brand-mark{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:#e9f0eb;color:var(--green);font-weight:750;font-size:18px}.header-title h1{font-size:16px;letter-spacing:-.02em;margin:0;font-weight:680}.header-title p{margin:2px 0 0;color:var(--muted);font-size:12px}.header-count{margin-left:auto;padding:7px 11px;border:1px solid var(--line);border-radius:20px;color:var(--muted);font-size:12px}.workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;padding:14px}.canvas-shell{position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#f8faf8;box-shadow:var(--shadow)}.react-flow{background:transparent}.task-node{width:250px;text-align:left;background:#fff;border:1px solid #e0e7e1;border-radius:12px;box-shadow:0 5px 18px #26372e0d;cursor:pointer}.task-node{padding:15px 16px 13px}.task-node:hover,.task-node.selected{border-color:#86a895;box-shadow:0 7px 24px #42654f18}.node-kicker,.detail-eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}.node-title{font-size:14px;line-height:1.4;font-weight:650;margin:7px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.node-description{font-size:12px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}.react-flow__handle{width:7px;height:7px;background:#98aa9e;border:1px solid #fff}.react-flow__edge-path{stroke-linecap:round}.react-flow__controls{overflow:hidden;border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow)}.react-flow__controls-button{border-bottom:1px solid var(--line);background:#fff;fill:#59645e}.fit-button{position:absolute;z-index:5;right:14px;top:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:var(--shadow);font-size:11px;cursor:pointer}.canvas-empty,.canvas-error{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);padding:15px 20px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);box-shadow:var(--shadow)}.canvas-error{color:#a44539}.details{min-height:0;overflow:auto;border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:20px 18px;box-shadow:var(--shadow)}.empty-details{display:grid;place-items:center}.detail-placeholder{text-align:center;color:#99a29d;line-height:2}.details-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:15px;border-bottom:1px solid var(--line)}.details-header h2{font-size:17px;line-height:1.35;margin:5px 0 0;letter-spacing:-.02em}.icon-button{border:0;background:transparent;color:var(--muted);font-size:23px;line-height:1;cursor:pointer}.detail-description{font-size:13px;color:#606d65;white-space:pre-wrap;margin:16px 0}.detail-stat{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #edf0ed;font-size:12px;color:var(--muted)}.detail-stat strong{color:var(--ink);font-weight:600}.task-metadata{padding:8px 0;border-bottom:1px solid var(--line)}.task-id-block{padding:13px 0;border-bottom:1px solid var(--line)}.task-id-block code{display:block;overflow-wrap:anywhere;margin:7px 0;color:var(--ink);font-size:11px}.task-id-block button{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:white;font-size:10px;cursor:pointer}.lane-node{color:var(--muted);font-size:12px;font-weight:680;letter-spacing:.04em}.react-flow__node{cursor:grab}.react-flow__node.dragging{cursor:grabbing}.legend{height:39px;flex:none;display:flex;align-items:center;gap:22px;padding:0 22px;color:var(--muted);font-size:10px}.legend span{display:flex;align-items:center;gap:6px}.line-sample{display:inline-block;width:23px;border-top:2px dashed #71849a}
@media(max-width:850px){.workspace{grid-template-columns:minmax(0,1fr) 270px}.task-node{width:220px}}
@media(max-width:650px){.workspace{position:relative;display:block;padding:9px}.canvas-shell{height:100%}.details{position:absolute;z-index:8;left:18px;right:18px;bottom:18px;top:auto;max-height:62%;min-height:180px}.empty-details{display:none}.task-node{width:210px}.header-count{font-size:10px}.legend{gap:12px;padding:0 12px;font-size:9px}}
</style>
<link rel="stylesheet" href="/app.css">
</head>
<body><div id="root"></div><script src="/app.js"></script></body>
</html>
